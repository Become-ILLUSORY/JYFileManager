name: jy_file_manager
description: "JY文件管理器 - Liquid Glass 风格的双面板文件管理器"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI：HyperOS / MIUI 风格组件 + Liquid Glass（OS4 玻璃材质）
  flutter_miuix: ^1.3.0

  # 状态管理
  provider: ^6.1.5

  # 文件与路径
  path: ^1.9.1
  path_provider: ^2.1.6

  # 压缩包：zip / tar / gz / bz2 / xz 等
  archive: ^4.3.0
  # 额外压缩算法：LZ4 / Zstandard（tar.lz4、tar.zst 支持）
  dart_lz4: ^1.4.0
  just_zstd: ^0.2.0

  # 哈希与加密（MD5/SHA/AES）
  crypto: ^3.0.7
  pointycastle: ^4.0.0

  # 文本编码（GBK/GB18030 等中文编码）
  enough_convert: ^1.7.1

  # 代码语法高亮（文本编辑器）
  re_highlight: ^0.0.3

  # 持久化
  shared_preferences: ^2.5.6

  # 打开文件（调用系统关联应用）
  open_filex: ^4.7.0
  # 分享
  share_plus: ^13.3.1

  # 远程管理：FTP / SFTP（ftpconnect 3.x 内置 SFTP 客户端）/ WebDAV
  ftpconnect: ^3.0.0
  dartssh2: ^3.3.1

  # 权限
  permission_handler: ^13.0.2

  # 设备信息（关于页）
  device_info_plus: ^13.3.0

  # 国际化日期格式
  intl: ^0.20.3

  # XML（APK 清单解析、mipmap 等）
  xml: ^7.1.0

  # 图片处理（APK 图标提取等）
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
