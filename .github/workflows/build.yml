name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'milestone/**' ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Prepare signing key (optional)
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > android/app/jy-release.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          storeFile=jy-release.jks
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Signing key configured"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No signing key — falling back to debug signing"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        id: apk
        run: |
          mkdir -p dist
          SRC=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          NAME="JYFileManager-v${VERSION}.apk"
          cp "$SRC" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### 📦 Build Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- **File**: \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Size**: $(du -h dist/$NAME | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA256**: \`$(sha256sum dist/$NAME | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          compression-level: 0

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
